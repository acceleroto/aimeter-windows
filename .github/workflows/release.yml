# Push a tag like v0.2.0 to build the installer and publish a GitHub Release.
# Installed copies pick the release up through Velopack's auto-update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet test -c Release

      - name: Publish app
        run: >
          dotnet publish src/AIMeter.App -c Release -r win-x64 --self-contained
          -p:Version=${{ env.VERSION }} -o publish

      - run: dotnet tool install -g vpk --version 1.2.161

      # Pull the previous release so this one ships a small delta update too.
      - name: Download previous release
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases
        continue-on-error: true

      - name: Pack installer
        run: >
          vpk pack -u AIMeterForWindows -v ${{ env.VERSION }} -p publish -e AIMeter.exe
          --packTitle AIMeter --packAuthors "Bryan Duke" -i src/AIMeter.App/app.ico
          --shortcuts StartMenuRoot -o releases

      - name: Upload release
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} -o releases
          --tag ${{ github.ref_name }} --releaseName "AIMeter ${{ env.VERSION }}" --publish
